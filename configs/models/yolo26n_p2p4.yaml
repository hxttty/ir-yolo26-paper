# Ultralytics YOLO26n Scale-Realigned P2-P4 Architecture (Mod A)
# Designed for high-altitude infrared UAV small target detection (HIT-UAV, 69.16% small targets):
# 1. Retains full Backbone P1-P5 + SPPF + C2PSA (100% pretrained weight transfer from yolo26n.pt).
# 2. Retains top-down FPN P5->P4->P3 (layers 11-16 identical to yolo26.yaml -> pretrained weights transfer!).
# 3. Adds compressed 32-channel P2/4 branch (C3k2 [128, False, 0.25] + DWConv downsampling).
# 4. Completely prunes P5 PAN neck & P5 Detect head (~515K params saved vs only ~64K for head-only pruning),
#    leveraging YOLO26's DFL-free (reg_max=1) unbounded regression so P4 handles medium/large vehicles cleanly,
#    while preserving YOLO26's top-head lightweight attention (attn=True) on layer 25 (P4).

# Parameters
nc: 4 # overridden automatically by dataset YAML
end2end: True
reg_max: 1
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone (identical to official yolo26.yaml -> full pretrained transfer from yolo26n.pt)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Scale-Realigned Lightweight P2-P4 Neck & Head (P5 PAN & P5 Head pruned)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13 (shared with yolo26.yaml -> pretrained transfer)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (shared with yolo26.yaml -> pretrained transfer)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False, 0.25]] # 19 (P2/4-xsmall, compressed 32ch at n-scale)

  - [-1, 1, DWConv, [128, 3, 2]] # 20 lightweight depthwise P2->P3 downsampling
  - [[-1, 16], 1, Concat, [1]] # 21 cat head P3
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 23 P3->P4 downsampling
  - [[-1, 13], 1, Concat, [1]] # 24 cat head P4
  - [-1, 1, C3k2, [512, True, 0.5, True]] # 25 (P4/16-medium, retains YOLO26 top-head attn=True)

  - [[19, 22, 25], 1, Detect, [nc]] # 26 Detect(P2/4, P3/8, P4/16)
